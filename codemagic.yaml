workflows:
  android-apk:
    name: Build Android APK (Capacitor)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 22
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build web app (with prerender)
        script: |
          # TanStack Start's prerender produces dist/client/index.html and
          # static HTML for every crawlable route, which Capacitor bundles
          # into the APK as the offline web assets.
          npm run build
          if [ ! -f "dist/client/index.html" ]; then
            echo "ERROR: dist/client/index.html not found after build." >&2
            echo "Listing dist/:" >&2
            find dist -maxdepth 3 -type f 2>/dev/null | head -50 >&2
            exit 1
          fi
          echo "Prerendered files:"
          find dist/client -maxdepth 2 -name "*.html" | head -20
      - name: Add Android platform
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
