workflows:
  android-apk:
    name: Build Android APK (Capacitor)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 21
    scripts:
      - name: Install dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build web app
        script: |
          npm run build
          # TanStack Start emits SSR output (no static index.html).
          # We start the preview server and capture the rendered HTML
          # for "/" into dist/client/index.html so Capacitor has a static
          # entry point. Client-side routing handles the rest in-app.
          npx vite preview --port 4173 --host 127.0.0.1 --strictPort &
          PREVIEW_PID=$!
          # Wait for the server to be ready
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ > /dev/null; then
              echo "Preview server is up"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:4173/ -o dist/client/index.html
          kill $PREVIEW_PID || true
          if [ ! -s "dist/client/index.html" ]; then
            echo "ERROR: failed to prerender dist/client/index.html" >&2
            ls -la dist/client || true
            exit 1
          fi
          echo "Prerendered index.html (first 40 lines):"
          head -40 dist/client/index.html || true
      - name: Add Android platform
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
